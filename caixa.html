<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#084073">
<meta name="robots" content="noindex">
<title>Caixa · Fila Fácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topo">
    <div class="topo-linha">
      <div>
        <p class="marca">Fila <span>Fácil</span></p>
        <p class="loja" id="loja"></p>
      </div>
      <span class="chip">Caixa</span>
    </div>
  </header>
  <main>
    <div id="avisos"></div>
    <div id="conteudo"></div>
  </main>
</div>
<div id="toast" class="toast" hidden><span id="toast-txt"></span><button type="button" id="toast-btn">DESFAZER</button></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="store.js"></script>
<script>
(function () {
  "use strict";
  var h = FF.h;
  var conteudo = document.getElementById("conteudo");
  document.getElementById("loja").textContent = FF.nomeLoja;
  var store = null, lista = [], carregado = false, aba = "fila";
  var arrastando = false, pendente = false, ultimoTotal = null, audio = null;

  function liberado() { try { return sessionStorage.getItem("filafacil-caixa") === "ok"; } catch (e) { return false; } }

  // ---------- som de nova chegada ----------
  function prepararSom() {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
    } catch (e) { audio = null; }
  }
  document.addEventListener("pointerdown", prepararSom, { passive: true });
  function plim() {
    if (!audio) return;
    try {
      [0, 0.12].forEach(function (d, i) {
        var t = audio.currentTime + d, o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = i ? 1320 : 990;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
        o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + 0.3);
      });
    } catch (e) { /* sem som */ }
  }

  // ---------- desfazer ----------
  var toast = document.getElementById("toast"), toastTxt = document.getElementById("toast-txt"), toastBtn = document.getElementById("toast-btn");
  var toastTimer = null, ultimaAcao = null;
  function mostrarToast(texto, id) {
    ultimaAcao = id;
    toastTxt.textContent = texto;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; ultimaAcao = null; }, 6000);
  }
  toastBtn.addEventListener("click", function () {
    if (!ultimaAcao) return;
    var id = ultimaAcao; ultimaAcao = null; toast.hidden = true;
    store.mudarStatus(id, "aguardando").catch(FF.avisoErro);
  });

  async function concluir(pessoa, status) {
    try {
      await store.mudarStatus(pessoa.id, status);
      mostrarToast(FF.senha(pessoa.senha) + " " + pessoa.nome + (status === "atendido" ? " atendido" : " rejeitado"), pessoa.id);
      try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) { /* ignora */ }
    } catch (e) { FF.avisoErro(e); render(); }
  }

  // ---------- tela de senha ----------
  function telaTrava() {
    var campo = h("input", { type: "password", id: "pin", inputmode: "numeric", autocomplete: "off", placeholder: "Senha do caixa" });
    var erro = h("p", { class: "erro-campo", "aria-live": "polite" });
    conteudo.replaceChildren(h("section", { class: "card trava" },
      h("h1", null, "Área do caixa"),
      h("p", { class: "sub" }, "Digite a senha definida no config.js."),
      h("form", { onsubmit: function (ev) {
        ev.preventDefault(); prepararSom();
        if (campo.value === String(FF.C.senhaCaixa || "")) {
          try { sessionStorage.setItem("filafacil-caixa", "ok"); } catch (e) { /* ignora */ }
          iniciar();
        } else { erro.textContent = "Senha incorreta."; campo.value = ""; campo.focus(); }
      } }, h("label", { for: "pin" }, "Senha"), campo, erro, h("button", { class: "btn", type: "submit" }, "Entrar"))));
    campo.focus();
  }

  // ---------- painel ----------
  function abas() {
    function b(id, txt) {
      return h("button", { class: "aba", type: "button", role: "tab", "aria-selected": String(aba === id),
        onclick: function () { aba = id; render(); } }, txt);
    }
    return h("div", { class: "abas", role: "tablist" }, b("fila", "Fila"), b("dados", "Dados"),
      h("a", { class: "aba", href: "qr.html", target: "_blank", rel: "noopener", style: "text-align:center;text-decoration:none" }, "QR Code ↗"));
  }
  function kpi(valor, rotulo, extra) {
    return h("div", { class: "kpi" }, h("strong", null, valor), h("span", null, rotulo), extra ? h("small", null, extra) : null);
  }

  function painelFila(a) {
    var agora = Date.now();
    var partes = [h("div", { class: "kpis" },
      kpi(String(a.fila.length), "na fila"),
      kpi(String(a.atendidos.length), "atendidos"),
      kpi(FF.duracao(a.esperaMedia), "espera média"))];

    if (!a.fila.length) {
      partes.push(h("section", { class: "card vazio" }, h("b", null, "Fila vazia"),
        "Mostre o QR Code no balcão para os clientes entrarem.",
        h("a", { class: "btn claro", href: "qr.html", target: "_blank", rel: "noopener" }, "Abrir QR Code")));
      return partes;
    }

    var p = a.fila[0];
    var trilho = h("div", { class: "trilho" },
      h("div", { class: "fundo-swipe", "aria-hidden": "true" }, h("span", { class: "dir" }, "✓ Atendido"), h("span", { class: "esq" }, "Rejeitar ✕")));
    var card = h("section", { class: "card atual", "aria-label": "Cliente sendo chamado" },
      h("div", { class: "topo-card" },
        h("span", { class: "senha-tag", style: "margin:0" }, FF.senha(p.senha)),
        h("span", { class: "tempo" }, "chamado há " + FF.duracao(agora - p.inicio))),
      h("p", { class: "nome" }, p.nome),
      h("p", { class: "tempo", style: "margin:0" }, "Chegou às " + FF.hora(p.entrada) + " · esperou " + FF.duracao(Math.max(0, p.inicio - p.entrada))),
      h("div", { class: "instrucao" }, h("span", null, h("b", { class: "r" }, "←"), " arraste para rejeitar"), h("span", null, "arraste para atender ", h("b", { class: "v" }, "→"))));
    trilho.appendChild(card);
    ligarArraste(trilho, card, p);
    partes.push(h("p", { class: "rotulo" }, "Agora no caixa"), trilho,
      h("div", { class: "acoes" },
        h("button", { class: "btn vermelho", type: "button", onclick: function () { concluir(p, "rejeitado"); } }, "✕ Rejeitar"),
        h("button", { class: "btn verde", type: "button", onclick: function () { concluir(p, "atendido"); } }, "✓ Atendido")));

    var resto = a.fila.slice(1);
    partes.push(h("p", { class: "rotulo" }, "Próximos (" + resto.length + ")"));
    if (resto.length) {
      partes.push(h("section", { class: "card", style: "padding:6px 16px" }, h("ul", { class: "lista" },
        resto.map(function (e, i) {
          return h("li", null, h("span", { class: "pos" }, String(i + 2)),
            h("div", { class: "quem" }, h("b", null, e.nome), h("span", null, FF.senha(e.senha) + " · chegou às " + FF.hora(e.entrada))),
            h("span", { class: "t" }, "há " + FF.duracao(agora - e.entrada)));
        }))));
    } else partes.push(h("section", { class: "card vazio", style: "padding:16px" }, "Ninguém esperando depois desta pessoa."));
    return partes;
  }

  function ligarArraste(trilho, card, pessoa) {
    var x0 = 0, dx = 0, id = null;
    card.addEventListener("pointerdown", function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      id = e.pointerId; x0 = e.clientX; dx = 0; arrastando = true;
      card.setPointerCapture(id);
      card.style.transition = "none";
    });
    card.addEventListener("pointermove", function (e) {
      if (e.pointerId !== id) return;
      dx = e.clientX - x0;
      card.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 40) + "deg)";
      trilho.dataset.dir = dx > 8 ? "dir" : dx < -8 ? "esq" : "";
    });
    function soltar(e) {
      if (e.pointerId !== id) return;
      id = null;
      var limite = card.offsetWidth * 0.33;
      card.style.transition = "transform .22s ease";
      if (Math.abs(dx) > limite) {
        var dir = dx > 0 ? 1 : -1;
        card.style.transform = "translateX(" + (dir * card.offsetWidth * 1.3) + "px) rotate(" + (dir * 12) + "deg)";
        setTimeout(function () { arrastando = false; concluir(pessoa, dir > 0 ? "atendido" : "rejeitado"); }, 200);
      } else {
        card.style.transform = "";
        trilho.dataset.dir = "";
        setTimeout(function () { arrastando = false; if (pendente) render(); }, 230);
      }
    }
    card.addEventListener("pointerup", soltar);
    card.addEventListener("pointercancel", soltar);
  }

  function grafico(a) {
    var agora = Date.now();
    if (!a.todos.length) return h("p", { class: "nota" }, "As chegadas aparecem aqui assim que alguém entrar na fila.");
    var inicio = a.todos[0].entrada;
    var span = Math.max(agora - inicio, 60000);
    var opcoes = [1, 2, 5, 10, 15, 30, 60], passo = 60;
    for (var i = 0; i < opcoes.length; i++) { if (span / (opcoes[i] * 60000) <= 12) { passo = opcoes[i]; break; } }
    var tam = passo * 60000;
    var base = Math.floor(inicio / tam) * tam;
    var n = Math.floor((agora - base) / tam) + 1;
    var cont = new Array(n).fill(0);
    a.todos.forEach(function (e) { var k = Math.floor((e.entrada - base) / tam); if (k >= 0 && k < n) cont[k] += 1; });
    var max = Math.max.apply(null, cont) || 1;
    return h("div", null,
      h("div", { class: "grafico", role: "img", "aria-label": "Chegadas por intervalo de " + passo + " minutos" },
        cont.map(function (c) { return h("div", { class: "barra" }, h("em", null, c ? String(c) : ""), h("i", { style: "height:" + (c / max * 85) + "%" })); })),
      h("div", { class: "eixo" }, cont.map(function (c, k) { return h("span", null, k % Math.ceil(n / 6) === 0 ? FF.hora(base + k * tam) : ""); })),
      h("p", { class: "nota" }, "Chegadas a cada " + passo + " min."));
  }

  var NOMES = { aguardando: "Na fila", atendido: "Atendido", rejeitado: "Rejeitado", desistiu: "Desistiu" };

  function baixarCSV(a) {
    var seguro = function (s) { s = String(s == null ? "" : s); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    var min = function (ms) { return ms == null ? "" : (ms / 60000).toFixed(2).replace(".", ","); };
    var linhas = [["senha", "nome", "chegada", "inicio_atendimento", "saida", "espera_min", "situacao"].join(";")];
    a.todos.forEach(function (e) {
      linhas.push([e.senha, seguro(e.nome), FF.hora(e.entrada), e.inicio ? FF.hora(e.inicio) : "", e.fim ? FF.hora(e.fim) : "",
        min(e.status === "desistiu" && e.fim ? e.fim - e.entrada : e.espera), NOMES[e.status] || e.status].join(";"));
    });
    var blob = new Blob(["﻿" + linhas.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = h("a", { href: url, download: "fila-facil-" + FilaStore.loja + ".csv" });
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function painelDados(a) {
    var rhoTxt = a.rho == null ? "–" : FF.pct(a.rho);
    var partes = [
      h("div", { class: "kpis" },
        kpi(String(a.todos.length), "chegadas"),
        kpi(String(a.atendidos.length), "atendidos"),
        kpi(String(a.fila.length), "na fila agora"),
        kpi(FF.duracao(a.esperaMedia), "espera média"),
        kpi(FF.duracao(a.maiorEspera), "maior espera"),
        kpi(FF.duracao(a.tmaReal), "tempo médio de atendimento"),
        kpi(String(a.desistencias.length), "desistências"),
        kpi(FF.pct(a.abandono), "taxa de abandono"),
        kpi(FF.duracao(a.tolerancia), "tolerância", "tempo médio até desistir"),
        kpi(FF.num(a.lambda, a.lambda != null && a.lambda < 10 ? 1 : 0), "chegadas por hora", "λ"),
        kpi(FF.num(a.mu, a.mu != null && a.mu < 10 ? 1 : 0), "capacidade por hora", "μ"),
        kpi(rhoTxt, "ocupação do caixa", "ρ = λ ÷ μ")),
      h("section", { class: "card" }, h("h2", null, "Chegadas ao longo do tempo"), grafico(a)),
      h("section", { class: "card" },
        h("h2", null, "Teoria das Filas"),
        a.rho == null
          ? h("p", { class: "sub" }, "Os cálculos aparecem depois do primeiro atendimento.")
          : h("div", null,
              h("p", { class: "sub" }, "Ocupação do caixa: ρ = " + FF.num(a.lambda, a.lambda < 10 ? 1 : 0) + " ÷ " + FF.num(a.mu, a.mu < 10 ? 1 : 0) + " = " + rhoTxt + "."),
              h("p", { class: "sub" }, a.wqTeorica != null
                ? "Espera prevista (modelo M/M/1): Wq = ρ ÷ (μ − λ) = " + FF.duracao(a.wqTeorica) + ". Espera medida: " + FF.duracao(a.esperaMedia) + "."
                : "As chegadas superam a capacidade do caixa (ρ ≥ 100%): a fila tende a crescer. Abrir outro caixa resolveria."),
              h("p", { class: "nota" }, "Com poucos atendimentos os números oscilam. A comparação fica mais confiável com mais dados."))),
    ];
    var historico = a.todos.slice().reverse();
    partes.push(h("section", { class: "card" }, h("h2", null, "Histórico"),
      historico.length
        ? h("table", { class: "tabela" },
            h("thead", null, h("tr", null, h("th", null, "Senha"), h("th", null, "Nome"), h("th", null, "Chegada"), h("th", null, "Espera"), h("th", null, "Situação"))),
            h("tbody", null, historico.map(function (e) {
              var w = e.status === "desistiu" && e.fim ? e.fim - e.entrada : e.status === "aguardando" ? Date.now() - e.entrada : e.espera;
              return h("tr", null, h("td", null, FF.senha(e.senha)), h("td", { class: "nm" }, e.nome), h("td", null, FF.hora(e.entrada)),
                h("td", null, FF.duracao(w)), h("td", null, h("span", { class: "st " + e.status }, NOMES[e.status] || e.status)));
            })))
        : h("p", { class: "sub" }, "Ninguém entrou na fila ainda.")));

    var apagar = h("button", { class: "btn perigo", type: "button" }, "Encerrar a fila e apagar os dados");
    var conf = null;
    apagar.addEventListener("click", async function () {
      if (!conf) {
        apagar.textContent = "Toque de novo para apagar tudo"; apagar.classList.add("confirmar");
        conf = setTimeout(function () { conf = null; apagar.textContent = "Encerrar a fila e apagar os dados"; apagar.classList.remove("confirmar"); }, 4000);
        return;
      }
      clearTimeout(conf); conf = null; apagar.disabled = true; apagar.textContent = "Apagando…";
      try { await store.apagarTudo(); } catch (e) { FF.avisoErro(e); }
    });
    partes.push(h("section", { class: "card botoes" },
      h("button", { class: "btn claro", type: "button", style: "margin:0", onclick: function () { baixarCSV(FF.analisar(lista, Date.now())); } }, "Baixar planilha (CSV)"),
      apagar,
      h("p", { class: "nota", style: "margin:0" }, "Apague os dados ao final da apresentação.")));
    return partes;
  }

  function render() {
    if (!carregado) return;
    if (arrastando) { pendente = true; return; }
    pendente = false;
    var a = FF.analisar(lista, Date.now());
    conteudo.replaceChildren(h("div", { style: "display:flex;flex-direction:column;gap:14px" },
      abas(), aba === "fila" ? painelFila(a) : painelDados(a)));
    document.title = (a.fila.length ? "(" + a.fila.length + ") " : "") + "Caixa · Fila Fácil";
  }

  function iniciar() {
    conteudo.replaceChildren(h("div", { class: "card vazio" }, "Conectando…"));
    FilaStore.abrir().then(function (s) {
      store = s;
      FF.avisoModo(s);
      s.assinar(function (l) {
        var chegadas = l.length;
        if (ultimoTotal != null && chegadas > ultimoTotal) plim();
        ultimoTotal = chegadas;
        lista = l; carregado = true; render();
      }, FF.avisoErro);
      setInterval(render, 15000);
    }).catch(function (e) { FF.avisoErro(e); conteudo.replaceChildren(); });
  }

  if (liberado()) iniciar(); else telaTrava();
})();
</script>
</body>
</html>
